apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 34
    buildToolsVersion '34.0.0'
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId APP_PACKAGE
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 54690
        versionName "11.4.2"
        multiDexEnabled true

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    signingConfigs {
        debug {
            storeFile file('../TMessagesProj/config/release.keystore')
            storePassword "android"
            keyAlias "androidkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            storeFile file('../TMessagesProj/config/release.keystore')
            storePassword "android"
            keyAlias "androidkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
        checkReleaseBuilds false
    }

    dexOptions {
        jumboMode = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig = true
    }

    namespace 'org.telegram.messenger.regular'
}

apply plugin: 'com.google.gms.google-services'